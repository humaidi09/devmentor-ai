name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: pip install -r requirements.lock
      - name: Run tests (demo mode, no secrets)
        env:
          DEMO_MODE: "true"
          CRON_SECRET: "test-secret"
        run: pytest

  web:
    name: Web (types, Biome, build, browser)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ../api/requirements.lock
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        env:
          DEMO_MODE: "true"
        run: |
          (cd ../api && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000) > /tmp/api.log 2>&1 &
          npm start -- --hostname 127.0.0.1 --port 3000 > /tmp/web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null && curl -fsS http://localhost:3000 >/dev/null; then break; fi
            sleep 2
          done
          npm run test:e2e

  database:
    name: SQL migrations and RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify migrations, ownership, and deletion
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f apps/api/tests/sql/bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f apps/api/tests/sql/integrity.sql

          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f apps/api/tests/sql/plan_transaction.sql
