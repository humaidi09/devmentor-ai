name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests (demo mode, no secrets)
        env:
          DEMO_MODE: "true"
          CRON_SECRET: "test-secret"
        run: pytest

  web:
    name: Close AI Phase 2 checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:logic
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Responsive, keyboard, accessibility and offline checks
        run: |
          npm start -- --hostname 127.0.0.1 --port 3001 > /tmp/close-ai-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001 >/dev/null; then break; fi
            sleep 2
          done
          npm run test:browser
      - name: Preserve server diagnostics
        if: failure()
        run: cat /tmp/close-ai-web.log || true

  account:
    name: Close AI Auth and RLS integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Start disposable local Supabase components and apply migrations
        run: bash supabase/test-stack.sh reset
      - name: Start local gateway and verify database authorization
        working-directory: apps/web
        run: |
          node tests/local-gateway.cjs > /tmp/close-ai-gateway.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:54321/auth/v1/health >/dev/null; then break; fi
            sleep 1
          done
          npm run test:backend
      - run: npm run build:account-test
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Verify account flows and preserved demo behavior
        working-directory: apps/web
        run: |
          node tests/start-account.cjs > /tmp/close-ai-account.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3002/auth >/dev/null; then break; fi
            sleep 1
          done
          npm run test:account-browser
          TEST_BASE_URL=http://127.0.0.1:3002 npm run test:browser
      - name: Preserve integration diagnostics
        if: failure()
        run: |
          cat /tmp/close-ai-account.log || true
          cat /tmp/close-ai-gateway.log || true
          docker compose -p close-ai-phase3 -f supabase/compose.test.yml ps
