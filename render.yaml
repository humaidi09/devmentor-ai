# Render Blueprint for the DevMentor AI backend (free tier).
# In Render: New +  ->  Blueprint  ->  pick this repo. It reads this file.
# Secrets marked `sync: false` are left blank for you to fill in the dashboard
# (they are never committed to the repo).
services:
  - type: web
    name: devmentor-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEMO_MODE
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: API_CORS_ORIGINS
        sync: false
