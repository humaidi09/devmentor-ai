# Disposable test stack only. Never point this at a production database.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: close-ai-local-only
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - ./tests/bootstrap.sql:/docker-entrypoint-initdb.d/bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
  auth:
    image: supabase/gotrue:v2.177.0
    depends_on:
      db: {condition: service_healthy}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:close-ai-local-only@db:5432/postgres?sslmode=disable
      GOTRUE_SITE_URL: http://127.0.0.1:3002
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:3002/auth/callback
      GOTRUE_JWT_SECRET: close-ai-local-testing-secret-at-least-32-chars
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: 'true'
    ports: ["127.0.0.1:59999:9999"]
  rest:
    image: postgrest/postgrest:v12.2.12
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGRST_DB_URI: postgres://authenticator:close-ai-local-only@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: close-ai-local-testing-secret-at-least-32-chars
    ports: ["127.0.0.1:53000:3000"]
